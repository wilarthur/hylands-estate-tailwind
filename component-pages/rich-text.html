<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Rich text</title>
    <link rel="stylesheet" href="https://use.typekit.net/dsf5ttx.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <div class="rich-text container mx-auto max-w-6xl px-10 py-8">
        <h1>Heading 1</h1>
        <hr class="divider">
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>
        <h4>Heading 4</h4>
        <h5>Heading 5</h5>
        <h6>Heading 6</h6>
        <p>Paragraph text</p>
        <ul>
            <li>UL list</li>
            <li>UL list</li>
            <li>UL list</li>
        </ul>
        <ol>
            <li>OL list</li>
            <li>OL list</li>
            <li>OL list</li>
        </ol>
        <blockquote>Quote text here</blockquote>
        <p>testing <a href="/">This is a test link</a> testing</p>

        <a class="border-[1px] shadow-lg hover:shadow-xl/20 border-black px-10 py-3 !no-underline transition-all ease-in-out"
            href="/">This is a
            button</a>


    </div>
</body>

</html>
